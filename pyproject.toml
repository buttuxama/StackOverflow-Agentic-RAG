[project]
name = "stackoverflow-agentic-rag"
version = "0.1.0"
description = "Agentic RAG with Stack Overflow retrieval and grounded answer synthesis"
readme = "README.md"
authors = [
    { name = "Usama Bashir", email = "buttuxama@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.22.1",
    "requests>=2.34.2",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.5.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = ["ruff>=0.15.0"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
