[project]
name = "stackoverflow-agentic-rag"
version = "0.1.0"
description = "Agentic RAG with Stack Overflow retrieval and grounded answer synthesis"
readme = "README.md"
authors = [
    { name = "Usama Bashir", email = "buttuxama@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=3.22.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = ["ruff>=0.15.0"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[project.scripts]
stackoverflow-assistant = "stackoverflow_agentic_rag.cli:main"
stackoverflow-db-init = "stackoverflow_agentic_rag.database:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = [".env", ".env.*", "**/__pycache__/**"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
